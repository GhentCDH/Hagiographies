[project]
name = "mathesar-tools"
version = "0.1.0"
description = "Configure Mathesar via its JSON-RPC API"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "utilities",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
mathesar-record-summaries = "mathesar_tools.record_summaries:main"
mathesar-connect-db = "mathesar_tools.connect_db:main"

[tool.uv.sources]
utilities = { path = "../utilities", editable = true }
