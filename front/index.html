<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>Hagiographies</title>
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231E64C8'/%3E%3Crect x='9' y='6' width='14' height='20' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M12.5 12h7M12.5 16h7M12.5 20h4' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
        <meta name="description" content="Browse the Hagiographies database of medieval Latin hagiographic texts, their manuscripts and editions (M-PATCH prototype corpus, Ghent University)." />
        <script>
            // Apply the saved theme before first paint (Pihka's prefs store).
            (function () {
                try {
                    var prefs = JSON.parse(localStorage.getItem("pihka-prefs") || "{}");
                    if (prefs.theme === "light" || prefs.theme === "dark") document.documentElement.dataset.theme = prefs.theme;
                } catch (e) { /* storage unavailable */ }
            })();
        </script>
        <link rel="stylesheet" href="./vendor/pihka/pihka/core/assets/stylesheets/pico.min.css" />
        <link rel="stylesheet" href="./vendor/pihka/pihka/core/assets/stylesheets/base.css" />
        <link rel="stylesheet" href="./app/theme/ugent.css" />
        <script type="importmap">
            {
                "imports": {
                    "@sqlite.org/sqlite-wasm": "./vendor/pihka/pihka/core/vendor/@sqlite.org/sqlite-wasm/dist/index.mjs",
                    "preact": "./vendor/pihka/pihka/core/vendor/preact/dist/preact.mjs",
                    "preact/hooks": "./vendor/pihka/pihka/core/vendor/preact/hooks/dist/hooks.mjs"
                }
            }
        </script>
        <link rel="modulepreload" href="./app/main.js" />
        <link rel="preload" href="./app/database/hagiographies.sqlite" as="fetch" type="application/vnd.sqlite3" crossorigin />
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="./app/main.js"></script>
    </body>
</html>
