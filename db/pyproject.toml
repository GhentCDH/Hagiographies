[project]
name = "hagio-db"
version = "0.1.0"
description = "Raw-SQL schema migrations for the hagiographies database"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "psycopg[binary]>=3.2",
    "rich>=13.0.0",
    "typer>=0.15",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
migrate = "hagio_db.migrate:entrypoint"
