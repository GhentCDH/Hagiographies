services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    env_file:
      - dev.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  mathesar:
    image: mathesar/mathesar:0.11.0
    env_file:
      - dev.env
    environment:
      # Mathesar's internal metadata DB must be SEPARATE from the research
      # database it manages — it refuses to manage its own internal DB.
      POSTGRES_DB: mathesar_django
      # Allow the in-network service name so the utils RPC client can reach it.
      ALLOWED_HOSTS: "localhost,127.0.0.1,mathesar"
    volumes:
      - ./mathesar/static:/code/static
      - ./mathesar/media:/code/.media
      - ./mathesar/secrets:/code/.secrets
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
  utils:
    build:
      context: .
      dockerfile: utils/Dockerfile
    volumes:
      - ./utils:/app/
      # db/ is deliberately NOT mounted: the just db_* recipes run it on the
      # host, and sharing db/.venv between host and container breaks both.
      - ./data:/data
    env_file:
      - dev.env
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  # ── Gateway & Data Publishing (Caddy) ──────────────────────────────────────
  gateway:
    image: caddy:2-alpine
    ports:
      - "9160:80"
    volumes:
      - ./caddy/:/etc/caddy/:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: always

volumes:
  caddy-data:
  caddy-config:
  postgres-data: